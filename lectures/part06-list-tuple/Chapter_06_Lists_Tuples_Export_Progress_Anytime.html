/* Chapter goals, outcomes, and course orientation */
.intro-nav{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.intro-nav .mod-btn{padding:10px 11px}
.intro-nav .mod-btn .mod-num{background:#2e6673;color:#d8fcf3}
.goal-lead{color:#385b69;font-size:14px;margin-bottom:15px!important}
.goal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.goal-card{background:#f7fbfd;border:1px solid #dbe9ed;border-radius:12px;padding:16px 17px;min-width:0}
.goal-card b{font-size:13px;color:#123b4c;display:block;margin-bottom:5px}
.goal-card p{font-size:12.8px;color:#526b78;margin:0}
.goal-number{font:800 11px ui-monospace,monospace;letter-spacing:.05em;color:#08838a;margin-bottom:7px}
.goal-card.wide{grid-column:span 2;background:#eaf8f5;border-color:#b8dfd8}
.overview-path{background:#f0f6f9;border:1px solid #d8e6ed;border-radius:11px;padding:13px 16px;color:#385d6d;font-size:12.5px;margin-top:14px}
.outcomes-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.outcome-card{display:flex;gap:12px;padding:12px 14px;border:1px solid #dce9ec;border-radius:11px;background:#fbfdfd}
.outcome-id{height:30px;min-width:40px;display:grid;place-items:center;background:#dcf2ee;color:#08766f;font-size:11px;font-weight:850;border-radius:8px}
.outcome-card b{font-size:12.5px;color:#173c4b}
.outcome-card p{font-size:12px;line-height:1.48;color:#58707d;margin:5px 0 0}
.outcome-card .route{color:#087e80;font-weight:700;font-size:11px;margin-top:6px}
.learning-criterion{font-size:12px;color:#4c6875;background:#eaf5f6;border-radius:11px;padding:12px 15px;margin-top:13px}
.lesson-outcome{font-size:12px;margin-top:13px;padding:9px 13px;background:#eef8f6;border:1px solid #d2e8e2;color:#215c5a;border-radius:10px}
.lesson-outcome strong{color:#077a78}
@media(max-width:970px){.goal-grid,.outcomes-grid{grid-template-columns:1fr}.goal-card.wide{grid-column:span 1}}
@media print{.intro-nav{display:none}}

/* The recap is always available; the certificate action is conditional. */
#slide #completion{margin-top:24px}
#slide #completion .completion-card{margin-top:0}
#slide #completion .summary-certificate-panel{background:linear-gradient(125deg,#f1f8fb,#f7fafc);border-color:#d3e4eb}
#slide #completion .summary-certificate-panel .completion-badge{background:#e7eef3;color:#48697a}
#slide #completion .summary-certificate-panel h2{font-size:21px}
#slide #completion .completion-actions-row:empty{display:none}
@media(max-width:970px){#slide #completion .completion-top{display:flex;flex-direction:column}}

/* Executable, editable source on every teaching slide */
.code-window .example-editor{display:block;width:100%;min-height:70px;resize:vertical;border:0;border-radius:0;outline:0;color:#eaf5ff;background:#14293e;padding:10px 18px 16px;font:13.2px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:4;white-space:pre;overflow:auto}
.code-window .example-editor:focus{box-shadow:inset 0 0 0 2px #69c9b4}
.example-tools{display:flex;align-items:center;flex-wrap:wrap;gap:7px;padding:9px 13px;background:#203b50;border-top:1px solid #35546a}
.example-tools button{font-size:12px;font-weight:750;border-radius:8px;padding:7px 12px;border:1px solid #467b86;background:#e5f7f3;color:#105c65;cursor:pointer}
.example-tools button:hover{background:#c1ece4}
.example-tools .reset-example{background:transparent;border-color:#567889;color:#cde4ea}
.example-tools .reset-example:hover{background:#2c4b60}
.example-tools button:disabled{opacity:.52;cursor:progress}
.example-tools details{font-size:11px;color:#c2dbe5;margin-left:auto}
.example-tools summary{cursor:pointer;padding:5px 1px}
.example-tools .stdin-input{display:block;width:min(420px,65vw);margin:7px 0 3px;resize:vertical;padding:9px;font:12px/1.5 monospace;color:#eaf6ff;background:#10273a;border:1px solid #527a88;border-radius:7px}
.example-results{display:none;padding:12px 16px;border-top:1px solid #44657b;background:#102b39;color:#dcf9f1}
.example-results.active{display:block}
.example-results.error{background:#402932;color:#ffdddd}
.example-results .result-heading{font-weight:800;text-transform:uppercase;font-size:10px;letter-spacing:.09em;margin-bottom:7px}
.example-results pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;color:inherit;font:12px/1.6 ui-monospace,Consolas,monospace;padding:0}
@media print{.example-tools{display:none}.code-window .example-editor{height:auto;resize:none}}

/* Set + Map advanced learning guides */

.api-table td:nth-child(2){width:28%}.api-table td:nth-child(3){width:19%}
.api-table code{font-size:12px;white-space:normal;overflow-wrap:anywhere;color:#08596a}

.guide-panel{background:#f8fbfd;border:1px solid #d9e8ef;border-radius:12px;padding:16px 19px}
.guide-panel h3{margin:0 0 8px!important;font-size:15px!important}.guide-panel ul{margin:0;padding-left:20px}.guide-panel li{font-size:13px;color:#3e6070;margin:6px 0;line-height:1.55}

let pyodideInstance = null;
const BASE = 'https://cdn.jsdelivr.net/pyodide/v0.27.7/full/';
const RUNNER = String.raw`
import json, io, contextlib, traceback
payload = json.loads(__grading_payload)
src = payload['source']
checks = payload['tests']
dict_of_sets = payload.get('dictSetValues', False)
feedback = []
passed = 0
marker = '# === BAI LAM ==='

def prepare(v):
    if isinstance(v, dict) and list(v.keys()) == ['__set__']:
        return set(v['__set__'])
    return v

def match(actual, spec):
    kind = spec['kind']
    value = spec['value']
    if kind == 'set':
        return isinstance(actual, set) and actual == set(value)
    if kind == 'list':
        return isinstance(actual, list) and actual == value
    if kind == 'dict':
        if not isinstance(actual, dict):
            return False
        if dict_of_sets:
            if set(actual) != set(value):
                return False
            return all(isinstance(actual[k], set) and actual[k] == set(v) for k, v in value.items())
        return actual == value
    return actual == value

if marker not in src:
    result = {'passed': 0, 'total': len(checks), 'cases': [], 'error': 'Giữ nguyên dòng # === BAI LAM === để hệ thống nhận biết phần dữ liệu đầu vào.'}
else:
    header, body = src.split(marker, 1)
    for i, test in enumerate(checks):
        try:
            local = {}
            buf = io.StringIO()
            with contextlib.redirect_stdout(buf):
                exec(compile(header, '<student-input>', 'exec'), local, local)
                for k, val in test['inputs'].items():
                    local[k] = prepare(val)
                exec(compile(body, '<student-code>', 'exec'), local, local)
            failures = []
            for key, spec in test['expected'].items():
                if key not in local or not match(local[key], spec):
                    failures.append(key)
            good = not failures
            if good: passed += 1
            feedback.append({'ok': good, 'name': test['name'] if test.get('public') else 'Bộ kiểm thử bổ sung ' + str(i), 'detail': ('Đạt' if good else 'Chưa đúng biến: ' + ', '.join(failures))})
        except Exception as exc:
            feedback.append({'ok': False, 'name': test['name'] if test.get('public') else 'Bộ kiểm thử bổ sung ' + str(i), 'detail': type(exc).__name__ + ': ' + str(exc)[:180]})
    result = {'passed': passed, 'total': len(checks), 'cases': feedback}
json.dumps(result, ensure_ascii=False)

const RUN_EXAMPLE = String.raw`
import contextlib, json, traceback
payload = json.loads(__example_payload)
source = payload.get('source', '')
stdin = payload.get('stdin', '')
class OutputLimit:
    def __init__(self, maximum=12000):
        self.maximum, self.text, self.truncated = maximum, '', False
    def write(self, value):
        value = str(value)
        remaining = self.maximum-len(self.text)
        if len(value) > remaining: self.truncated = True
        if remaining > 0: self.text += value[:remaining]
        return len(value)
    def flush(self): pass
    def getvalue(self):
        return self.text + ('\n... (đầu ra đã được rút gọn)' if self.truncated else '')
output = OutputLimit()
lines = iter(stdin.splitlines())
def example_input(prompt=''):
    output.write(prompt)
    try:
        return next(lines)
    except StopIteration:
        raise EOFError('Thiếu dữ liệu input(). Hãy mở mục Dữ liệu nhập và thêm giá trị, mỗi dòng một giá trị.')
namespace = {'__name__':'__main__', 'input': example_input}
ok = True
try:
    with contextlib.redirect_stdout(output), contextlib.redirect_stderr(output):
        exec(compile(source, '<code-trong-slide>', 'exec'), namespace, namespace)
except BaseException as exc:
    ok = False
    output.write('\n' + ''.join(traceback.format_exception_only(type(exc), exc)))
    positions = [f.lineno for f in traceback.extract_tb(exc.__traceback__) if f.filename == '<code-trong-slide>']
    if positions:
        output.write('Dòng gây lỗi: ' + str(positions[-1]))
result = {'ok': ok, 'output': output.getvalue()}
json.dumps(result, ensure_ascii=False)

async function boot(){
  if(pyodideInstance) return pyodideInstance;
  importScripts(BASE + 'pyodide.js');
  pyodideInstance = await loadPyodide({indexURL: BASE});
  self.postMessage({type:'loaded'});
  return pyodideInstance;
}
self.onmessage = async (event) => {
  const req = event.data;
  if(req.type !== 'grade' && req.type !== 'example') return;
  try {
    const py = await boot();
    const isExample = req.type === 'example';
    py.globals.set(isExample ? '__example_payload' : '__grading_payload', JSON.stringify(req.payload));
    const raw = await py.runPythonAsync(isExample ? RUN_EXAMPLE : RUNNER);
    self.postMessage({type: isExample ? 'example-result' : 'result', id:req.id, value:JSON.parse(raw)});
  }catch(err){self.postMessage({type:'error',id:req.id,error:String(err?.message || err)});}
};

function runExample({source,stdin,button,result,isScratch=false}){

 q('runCode').onclick=()=>runCode(mid);
 q('showHint').onclick=()=>{let el=q('hintBox');el.classList.toggle('show');q('showHint').textContent=el.classList.contains('show')?'Ẩn gợi ý':'Gợi ý'};
 q('resetCode').onclick=()=>{if(!confirm('Khôi phục mẫu bài làm? Nội dung đang viết sẽ bị thay thế.'))return;q('codeEditor').value=task.starter;state.drafts[mid]=task.starter;persist()};
 refreshGate(mid);
}
function gradeQuiz(mid){
 const m=MODULES[mid],ans=state.answers[mid]||{};
 if(m.quiz.some((_,i)=>!Number.isInteger(ans[i]))){alert('Vui lòng chọn đáp án cho cả 3 câu trước khi chấm.');return}
 const score=m.quiz.reduce((acc,item,i)=>acc+(ans[i]===item.answer?1:0),0);
 state.quizScores[mid]=score;
 if(score>=2) state.quizPassed[mid]=true;
 state.passed[mid]=!!state.quizPassed[mid] && !!state.codePassed[mid];
 persist();refreshGate(mid);renderNavigation();
}
function refreshGate(mid){
 const m=MODULES[mid],qscore=state.quizScores[mid],answers=state.answers[mid]||{};
 q('quizStatus').textContent=qscore===undefined?'Chưa chấm':`Kết quả: ${qscore}/3 · ${state.quizPassed[mid]?'Đạt':'Chưa đạt'}`;
 q('quizStatus').className='result-status '+(state.quizPassed[mid]?'pass':qscore===undefined?'':'fail');
 m.quiz.forEach((item,i)=>{
  const el=q(`qfeedback-${i}`);
  if(qscore===undefined){el.innerHTML='';return}
  const good=answers[i]===item.answer;
  el.innerHTML=`<div class="q-feedback ${good?'good':'bad'}"><b>${good?'✓ Đúng':'✗ Chưa đúng'}.</b> ${item.why}</div>`;
 });
 if(state.codePassed[mid]){
  const el=q('codeFeedback');el.style.display='block';el.className='feedback good';if(!el.dataset.hasCurrent)el.textContent='✓ Bài lập trình đã đạt ở một lần kiểm thử trước. Bạn có thể chạy lại để kiểm tra phiên bản mới.';
 }
 const div=q('gateAchievement');
 div.innerHTML=state.passed[mid]?`<div class="achievement"><b>✓ Đã vượt qua chặng ${mid+1}</b><br>${mid<MODULE_COUNT-1?'Bài học '+(mid+2)+' đã được mở khóa. Bấm “Tiếp theo” để học tiếp.':'Bạn đã vượt toàn bộ bài kiểm tra của Chương 6.'}</div>`:`<div class="achievement" style="background:#f5f8fb;border-color:#d8e4eb;color:#52717f"><b>🔒 Bài học tiếp theo đang khóa</b><br>Quiz: ${state.quizPassed[mid]?'✓ Đạt':'chưa đạt'} · Lập trình: ${state.codePassed[mid]?'✓ Đạt':'chưa đạt'}.</div>`;
 q('next').disabled=!state.passed[mid] || mid===MODULE_COUNT-1;
 q('next').textContent=state.passed[mid]?(mid===MODULE_COUNT-1?'Đã hoàn thành':'Tiếp theo →'):'🔒 Cần đạt kiểm tra';
}
function makeWorker(){
 const content=q('graderWorker').textContent;
 const workerUrl=URL.createObjectURL(new Blob([content],{type:'application/javascript'}));
 const result=new Worker(workerUrl);URL.revokeObjectURL(workerUrl);
 workerLoaded=false;
 result.onmessage=e=>{
  const msg=e.data;
  if(msg.type==='loaded'){
    workerLoaded=true;
    if(gradePending){clearTimeout(graderTimeout);graderTimeout=setTimeout(()=>abortGrade('Mã chạy quá lâu (> 15 giây) hoặc chứa vòng lặp vô hạn.'),15000);setGradeFeedback('Đã tải Python. Đang chạy các bộ kiểm thử...',false)}
    if(examplePending){clearTimeout(exampleTimeout);exampleTimeout=setTimeout(()=>abortExample('Mã chạy quá 12 giây, có thể chứa vòng lặp vô hạn.'),12000);renderExampleFeedback(examplePending.result,'Đang thực thi Python…',false,examplePending.isScratch)}
    return;
  }
  if(examplePending && msg.id===examplePending.id){finishExample(msg);return}
  if(!gradePending || msg.id!==gradePending.id)return;
  clearTimeout(graderTimeout);
  const {mid}=gradePending;gradePending=null;
  if(msg.type==='error')setGradeFeedback('Lỗi môi trường Python: '+msg.error,false,true);
  else processGrading(mid,msg.value);
  const btn=q('runCode');if(btn)btn.disabled=false;
 };
 result.onerror=ev=>{
  const detail=ev.message||'Không thể tải Pyodide. Kiểm tra kết nối Internet.';
  if(examplePending)abortExample(detail);
  if(gradePending)abortGrade(detail);
 };
 return result;
}
function setGradeFeedback(text,success=false,isError=false){
 const el=q('codeFeedback');if(!el)return;
 el.style.display='block';el.dataset.hasCurrent='true';el.className='feedback '+(success?'good':isError?'bad':'');el.textContent=text;
}
function abortGrade(msg){
 if(graderTimeout) clearTimeout(graderTimeout);
 if(worker){worker.terminate();worker=null}workerLoaded=false;gradePending=null;
 const btn=q('runCode');if(btn)btn.disabled=false;
 setGradeFeedback('Không thể hoàn tất lượt chấm: '+msg+' Bạn có thể thử lại.',false,true);
}
function runCode(mid){
 if(gradePending) return;
 if(examplePending)abortExample('Chuyển sang chấm bài lập trình.');
 const source=q('codeEditor').value;
 if(!source.includes(MARKER)){setGradeFeedback('Thiếu dòng # === BAI LAM === trong mã nguồn. Vui lòng giữ nguyên dòng phân cách.',false,true);return}
 const coding=MODULES[mid].coding;
 if(!worker){try{worker=makeWorker()}catch(err){setGradeFeedback('Trình duyệt không hỗ trợ tạo Web Worker: '+String(err),false,true);return}}
 const id=++requestCount;
 gradePending={mid,id};
 q('runCode').disabled=true;
 setGradeFeedback(workerLoaded?'Đang chạy kiểm thử Python...':'Đang tải bộ thực thi Python lần đầu. Cần kết nối mạng...',false);
 graderTimeout=setTimeout(()=>abortGrade('Quá thời gian tải Python (90 giây).'),workerLoaded?15000:90000);
 worker.postMessage({type:'grade',id,payload:{source,tests:coding.tests,dictSetValues:!!coding.dictSetValues}});
}
function processGrading(mid,res){
 const good=!res.error && res.passed===res.total && res.total>0;
 const lines=(res.cases||[]).map((x,i)=>`${x.ok?'✓':'✗'} ${x.name}: ${x.detail}`);
 setGradeFeedback(`${good?'✓ ĐẠT':'✗ CHƯA ĐẠT'} · ${res.passed||0}/${res.total||0} bộ kiểm thử\n${res.error||lines.join('\n')}`,good,!good);
 if(good)state.codePassed[mid]=true;
 state.passed[mid]=!!state.quizPassed[mid]&&!!state.codePassed[mid];
 persist();refreshGate(mid);renderNavigation();
}
function render(){if(!accessibleStep(current))current=maxAllowed()*STEPS_PER_MODULE;renderNavigation();renderSlide()}
q('prev').onclick=()=>move(current-1);
q('next').onclick=()=>move(current+1);
q('resetAll').onclick=()=>{if(!confirm('Xóa toàn bộ điểm quiz, bài code đã lưu và tiến độ mở khóa trên trình duyệt này?'))return;state=initial();current=-INTRO_SLIDES.length;persist();render()};
q('fullScreen').onclick=()=>{if(document.fullscreenElement){document.exitFullscreen?.();return}document.documentElement.requestFullscreen?.()};
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;if(e.target.closest('textarea,input,button'))return;if(e.key==='ArrowRight'){e.preventDefault();move(current+1)}else if(e.key==='ArrowLeft'){e.preventDefault();move(current-1)}});
render();
</script>
</body>
